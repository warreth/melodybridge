# Development compose: builds MelodyBridge from the repo, runs it with
# verbose logging and the dev panel enabled, next to FlareSolverr.
# Start with:  docker compose -f docker-compose.yml up -d --build
# The app listens on http://localhost:3333 (dev panel /dev).

services:
  # Solves Cloudflare challenges for the Lucida plugin.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: melodybridge_dev_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Amsterdam
    restart: unless-stopped

  melodybridge:
    build: .
    image: melodybridge:dev
    container_name: melodybridge_dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3333:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_DETAILEDERRORS=true
      - ASPNETCORE_URLS=http://+:80
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft=Debug
      - Logging__LogLevel__System=Debug
      - Jellyfin__BaseUrl=http://host.docker.internal:8096
      - Jellyfin__ApiKey=
      - DevPanel__Enabled=true
      - FlareSolverr__Url=http://flaresolverr:8191
    volumes:
      - ./data/music:/music
      - ./data/playlists:/app/playlists
      - ./data/app:/app
    restart: unless-stopped
