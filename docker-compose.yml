# Development compose: always rebuilds MelodyBridge from the repo and runs
# it with verbose logging and the dev panel enabled, next to FlareSolverr.
# Start with:  docker compose -f docker-compose.yml up -d --build
# The app listens on http://localhost:3333 (dev panel /dev).

services:
  # Solves Cloudflare challenges for the Lucida plugin. Runs on the
  # same network as the app, which finds it by its Docker DNS name.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: melodybridge_dev_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - melodybridge

  melodybridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: melodybridge:dev
    container_name: melodybridge_dev
    depends_on:
      flaresolverr:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3333:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_DETAILEDERRORS=true
      - ASPNETCORE_URLS=http://+:80
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft=Debug
      - Logging__LogLevel__System=Debug
      - DevPanel__Enabled=true
      - MELODYBRIDGE_DB=/app/state/melodybridge.db
    # Volumes map a HOST path (left of the colon) to a CONTAINER path
    # (right side). MelodyBridge only ever sees the container side, so
    # every path typed in the app (music folder, scan locations, M3U
    # output) must be the right-hand path, like /music. The left side is
    # where the files really live on your machine; change it to your
    # own folder and keep the right side as is.
    volumes:
      # Downloads land here. In the app: /music (Settings, Default paths).
      - ../../../Music/mb-data/music:/music
      # M3U playlists are written here. In the app: /app/playlists.
      - ../../../Music/mb-data/playlists:/app/playlists
      # State mount must not cover /app itself: that would hide
      # the application binaries inside the image.
      - ../../../Music/mb-data/app:/app/state
    restart: unless-stopped
    networks:
      - melodybridge

# One explicit network so the app can always resolve the solver by
# its service name, even when the user changes container names.
networks:
  melodybridge:
    name: melodybridge
