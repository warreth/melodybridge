name: Release Docker Image

# Release images come from published GitHub releases and v* tags only;
# a plain push to main is not a release and must not touch :latest.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  # Manual runs exist for testing the build; they only ever tag :dev.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository == <owner>/<repo>, lowercased by GHCR convention
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One metadata step picks the tag list by event type so there is no
      # code path where a manual run can overwrite :latest or a version tag.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Manual dispatch: dev build, tag ONLY :dev.
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            # Release / v* tag: :X.Y.Z, :major and :latest.
            type=semver,pattern={{version}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{major}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
