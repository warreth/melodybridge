name: Release Docker Image

# The image publishes from a published GitHub release only: that is also
# the moment the About update check sees the version. A plain tag push
# or a push to main never touches the registry. Manual runs exist for
# testing the build; they only ever tag :dev.
on:
  release:
    types: [published]
  workflow_dispatch:

# Releases are rare and must never cancel each other: a cancelled run
# would leave a version without its image.
concurrency:
  group: release-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # github.repository == <owner>/<repo>, lowercased by GHCR convention
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The public image must never ship code that was not green. The fast
  # suite is the cheap gate; the container suites below are the real one.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MelodyBridge.sln

      # The fast suite probes real audio files (ffprobe/ffmpeg).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: dotnet build MelodyBridge.sln -c Release --no-restore

      - name: Fast suite
        run: >
          dotnet test MelodyBridge.sln -c Release --no-build
          --filter "FullyQualifiedName!~Tests.Integration&Category!=Live"

  # Real Jellyfin, Plex and Navidrome containers plus the end-to-end
  # pipeline run: a release must not publish an image whose sync clients
  # and download pipeline have never met real servers.
  release-gate:
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit

  build-and-push:
    needs: [verify, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Multi-platform builds (amd64 plus arm64 for NAS boxes and Apple
      # Silicon) need QEMU on the runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A prerelease tag (a hyphen after the version, like v1.0.0-beta1)
      # must never touch :latest or the major tag: users pulling :latest
      # get only stable releases. Prereleases move the :beta channel.
      - name: Detect prerelease
        id: pre
        run: |
          if echo "${{ github.ref_name }}" | grep -Eq '^v?[0-9.]+-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The image stamps the version from the tag exactly as written (minus
      # the v), and the tag list below is built from the same value: a
      # v1.0-rc2 release ships 1.0-rc2 and beta, a v1.0 release ships 1.0,
      # 1 and latest. Manual runs pass nothing.
      - name: Version for stamping
        id: version
        run: |
          ref="${GITHUB_REF_NAME#v}"
          if echo "$ref" | grep -Eq '^[0-9]+\.[0-9]+'; then
            echo "value=$ref" >> "$GITHUB_OUTPUT"
            echo "major=${ref%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "major=" >> "$GITHUB_OUTPUT"
          fi

      # One metadata step picks the tag list by event type so there is no
      # code path where a manual run can overwrite :latest or a version tag.
      # The values are raw (not type=semver) so a tag like v1.0-rc2 cannot
      # silently produce an empty tag list.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Manual dispatch: dev build, tag ONLY :dev.
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            # Release: the version exactly as tagged, always.
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.event_name != 'workflow_dispatch' && steps.version.outputs.value != '' }}
            # Stable only: the major tag and :latest.
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ github.event_name != 'workflow_dispatch' && steps.pre.outputs.prerelease == 'false' && steps.version.outputs.major != '' }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' && steps.pre.outputs.prerelease == 'false' }}
            # Prerelease only: the moving :beta channel.
            type=raw,value=beta,enable=${{ github.event_name != 'workflow_dispatch' && steps.pre.outputs.prerelease == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
