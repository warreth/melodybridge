name: Release gate

# The release gate boots real Jellyfin, Plex and Navidrome containers and
# runs the end-to-end pipeline test against them: a real Spotify playlist
# is fetched, up to six of its tracks are downloaded through the app's own
# waterfall (booted from AddMelodyBridge, every shipped plugin,
# availability decides) until at least two real files exist, the quality
# and archive copies are read from disk, an M3U is written and the
# playlist is
# pushed into the containers and streamed back. Everything is tagged
# Category=ReleaseGate so this only runs here (and monthly), never on a
# plain push. The fixtures self-skip unless the images are already pulled,
# so the images are pulled first.
#
# PLEX_TOKEN is optional: without it the claimed-server Plex sync test
# skips itself and the Plex leg of the end-to-end run checks the honest
# report instead of a full push.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Monthly, the first day at 03:00 UTC.
    - cron: "0 3 1 * *"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MelodyBridge.sln

      - name: Build
        run: dotnet build MelodyBridge.sln -c Release --no-restore

      # The end-to-end run downloads real tracks (SoundCloud and YouTube
      # legs both go through yt-dlp), so yt-dlp and ffmpeg must be on
      # PATH, exactly like the shipped image has them.
      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo pip3 install --break-system-packages yt-dlp
          yt-dlp --version

      # The fixtures inspect for the images; without a pull they would
      # skip themselves and the job would prove nothing.
      - name: Pull media server images
        run: |
          docker pull jellyfin/jellyfin:latest
          docker pull deluan/navidrome:latest
          docker pull plexinc/pms-docker:latest

      - name: Release gate suites
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: >
          dotnet test MelodyBridge.sln -c Release --no-build
          --filter "Category=ReleaseGate"
          --logger "trx;LogFileName=release-gate.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-results
          path: MelodyBridge.Tests/TestResults/*.trx
          if-no-files-found: ignore
