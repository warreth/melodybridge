name: Deploy VitePress Docs

on:
    push:
        branches: [main]
        paths:
            - "**/*.md"
            - "docs/**"

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json','**/package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-modules-

            - name: Install dependencies (if present)
              run: |
                  if [ -f package-lock.json ] || [ -f package.json ]; then
                    npm ci --no-audit --prefer-offline;
                  else
                    echo "No package.json found, skipping npm install";
                  fi

            - name: Build docs
              run: |
                  if [ -f package.json ]; then
                    npm run docs:build || npm run build || echo "No build script found";
                  else
                    # Try vitepress default: build from docs folder using npx
                    npx vitepress build docs || true
                  fi

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/.vitepress/dist

            - name: Deploy to Pages
              uses: actions/deploy-pages@v4
