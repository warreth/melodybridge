name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# New pushes to the same branch/PR replace the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MelodyBridge.sln

      - name: Build
        run: dotnet build MelodyBridge.sln -c Release --no-restore

      # Fast suite: everything except live-network tests.
      - name: Unit tests
        run: dotnet test MelodyBridge.sln -c Release --no-build --verbosity normal
          --filter "FullyQualifiedName!~Tests.Integration"

  # Honest suite: real network to open.spotify.com, real SQLite files.
  # If the public embed page changes shape, this job fails loudly.
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MelodyBridge.sln

      - name: Build
        run: dotnet build MelodyBridge.sln -c Release --no-restore

      - name: Install yt-dlp and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo pip3 install --break-system-packages yt-dlp
          yt-dlp --version

      - name: Live tests (Spotify + yt-dlp + real SQLite)
        run: dotnet test MelodyBridge.sln -c Release --no-build
          --filter "Category=PlaylistStore|Category=Live"

  # The docs tell users to wget https://melodybridge.app/compose.yml,
  # so that published copy must never drift from this repo's compose.yml.
  # Fails loudly with a diff when it does.
  compose-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare against the published copy
        run: ./scripts/check-compose-drift.sh

  # The docs build is also the link check: VitePress fails on dead links.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Relative-link check: catches stale refs between md/html files
      - run: npm run docs:check

      # Build doubles as the internal dead-link check (VitePress fails on dead links)
      - run: npm run docs:build
