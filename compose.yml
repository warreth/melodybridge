# Production compose for end users: MelodyBridge from GHCR plus
# FlareSolverr on one internal network. Start with:  docker compose up -d
# Then open http://localhost:3333 and configure Jellyfin in Settings.

services:
  # Cloudflare solver for the Lucida plugin. Only reachable on the
  # internal compose network, never published to the host. The app
  # probes both of its names there: the service name and the container
  # name below.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mb_flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      melodybridge:
        # Explicit alias so the plain service name resolves too, whatever
        # the container is named.
        aliases:
          - flaresolverr

  melodybridge:
    image: ghcr.io/warreth/melodybridge:latest
    container_name: melodybridge
    depends_on:
      flaresolverr:
        condition: service_healthy
    # Reaches a Jellyfin running on the host through this alias.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 3333 on every host interface. Use "127.0.0.1:3333:80" instead to
    # keep the app reachable from this machine only.
    ports:
      - "3333:80"
    environment:
      # Where the server listens inside the container; the base image
      # would otherwise pick its own default port.
      - ASPNETCORE_URLS=http://+:80
      - FlareSolverr__Url=auto
      # SQLite database and runtime state on the mounted volume.
      - MELODYBRIDGE_DB=/app/state/melodybridge.db
    # Volumes map a HOST path (left) to a CONTAINER path (right). Every
    # path typed in the app is a container path, like /music; change
    # only the left side to your own folders.
    volumes:
      # Downloads (in the app: /music), M3U output (/app/playlists) and
      # the database plus app state (/app/state).
      - ./data/music:/music
      - ./data/playlists:/app/playlists
      - ./data/app:/app/state
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - melodybridge

# One explicit network so the app can always resolve the solver by its
# service name, whatever the containers are named.
networks:
  melodybridge:
    name: melodybridge
